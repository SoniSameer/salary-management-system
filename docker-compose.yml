# Local PostgreSQL fallback when you do not want to use Neon.
# Start:  docker compose up -d
# Then set in .env:
#   DATABASE_URL=postgresql://salary:salary@localhost:5432/salary
#   DIRECT_URL=postgresql://salary:salary@localhost:5432/salary
#   TEST_DATABASE_URL=postgresql://salary:salary@localhost:5432/salary_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
